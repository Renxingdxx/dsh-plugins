# dsh-custom-splash — bundle patch
#
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件的 patch，
# 本文件把自定义开屏动画插件插入当前 profile 的配置树。
#
# 安装：
#   dsh plugin --profile web add dsh-custom-splash
# 或本地开发：
#   dsh plugin --profile web add link:<本目录绝对路径>
#
# 配置示例（覆盖行来改 config；只写想改的字段）：
#   - id: dsh-custom-splash
#     name: dsh-custom-splash
#     config:
#       src: D:/wallpapers/opening.webm
#       audio: D:/music/opening.mp3
#       muted: false
#       volume: 0.8
#       unlockOnGesture: true
#       skip: button
#
# 完整字段见 README.md「配置」一节。

- insert:
    - id: dsh-custom-splash
      name: dsh-custom-splash
