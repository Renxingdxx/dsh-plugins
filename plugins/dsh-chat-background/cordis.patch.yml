# dsh-chat-background — bundle patch
#
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件的 patch，
# 本文件把聊天视频背景插件插入当前 profile 的配置树。
#
# 安装：
#   dsh plugin --profile web add dsh-chat-background
# 或本地开发：
#   dsh plugin --profile web add link:<本目录绝对路径>
#
# 配置示例（覆盖行来改 config；只写想改的字段）：
#   - id: dsh-chat-background
#     name: dsh-chat-background
#     config:
#       src: D:/wallpapers/bg.mp4
#       opacity: 0.6
#       blur: 4
#       themeAuto: true
#       themeColor: '#6f86ff'
#       regions:
#         - id: vignette
#           shape: radial
#           anchor: { x: 0.5, y: 0.5 }
#           size: 1.15
#           strength: 0.55
#           color: '#000000'
#           blend: multiply
#
# 完整字段见 README.md「配置」一节。

- insert:
    - id: dsh-chat-background
      name: dsh-chat-background
